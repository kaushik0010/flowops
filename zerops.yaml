zerops:
  # NOTE: The setup name must match the service name created in the Zerops GUI.
  - setup: flowops
    build:
      base: nodejs@22
      buildCommands:
        - corepack enable
        - corepack prepare pnpm@11.0.9 --activate
        - pnpm install --frozen-lockfile
        - pnpm build
        - '[ -d public ] && cp -r public .next/standalone/public || true'
        - cp -r .next/static .next/standalone/.next/static
      deployFiles:
        - .next/standalone/~

    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        NODE_ENV: production
        HOSTNAME: 0.0.0.0
        PORT: "3000"
      start: node server.js