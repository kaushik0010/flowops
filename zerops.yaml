zerops:
  - setup: app
    build:
      base: nodejs@20
      buildCommands:
        - corepack enable
        - corepack prepare pnpm@11.0.9 --activate
        - pnpm install --frozen-lockfile
        - pnpm build
        - '[ -d public ] && cp -r public .next/standalone/public || true'
        - cp -r .next/static .next/standalone/.next/static
      deployFiles:
        - .next/standalone/~

    run:
      base: nodejs@20
      start: node server.js
      ports:
        - port: 3000
          httpSupport: true
      envVariables:
        HOSTNAME: 0.0.0.0
        NODE_ENV: production
        PORT: "3000"